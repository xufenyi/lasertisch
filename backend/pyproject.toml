[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lasertisch"
version = "0.1.0"
description = "Canonical geometry and contracts for the LaserTisch CAD/CAM application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "shapely>=2.1.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]


