[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lasertisch"
version = "0.1.0"
description = "Canonical geometry and contracts for the LaserTisch CAD/CAM application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pywebview==6.2.1",
    "shapely>=2.1.2,<3",
    "fonttools>=4.60,<5",
    "uharfbuzz>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.3",
    "pytest>=8.4,<10",
]

[project.gui-scripts]
lasertisch = "lasertisch.desktop.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lasertisch = ["assets/fonts/*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]


